
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .bee-app {
    min-height: 100vh;
    background: #0a0a0f;
    color: #f0ead6;
    font-family: 'DM Sans', sans-serif;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .bee-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 0.5rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    color: #f5c842;
    letter-spacing: -1px;
    line-height: 1;
  }

  .header p {
    font-size: 14px;
    color: #888;
    margin-top: 0.5rem;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .card {
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 700px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .setting-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #1c1c28;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 0.5rem 1rem;
  }

  .setting-group label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .setting-group input[type=number], .setting-group select {
    background: transparent;
    border: none;
    color: #f5c842;
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    width: 50px;
    outline: none;
    -moz-appearance: textfield;
  }

  .setting-group input::-webkit-outer-spin-button,
  .setting-group input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .setting-group select {
    width: auto;
    cursor: pointer;
  }

  .word-display {
    text-align: center;
    padding: 2rem 1rem;
    border-radius: 16px;
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    margin-bottom: 1.5rem;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .word-display::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(245,200,66,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .word-category {
    font-size: 11px;
    color: #f5c842;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    opacity: 0.8;
  }

  .word-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 4px;
    transition: all 0.3s ease;
  }

  .word-definition {
    font-size: 13px;
    color: #666;
    margin-top: 0.75rem;
    font-style: italic;
    max-width: 400px;
    text-align: center;
    line-height: 1.5;
  }

  .word-origin {
    font-size: 11px;
    color: #444;
    margin-top: 0.5rem;
    letter-spacing: 1px;
  }

  .idle-message {
    font-size: 18px;
    color: #444;
    text-align: center;
  }

  .timer-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 1.5rem;
  }

  .timer-ring svg {
    transform: rotate(-90deg);
    width: 120px;
    height: 120px;
  }

  .timer-ring .bg-ring { fill: none; stroke: #2a2a3a; stroke-width: 8; }

  .timer-ring .progress-ring {
    fill: none;
    stroke: #f5c842;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
  }

  .timer-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-number {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: #f5c842;
    line-height: 1;
  }

  .timer-label {
    font-size: 9px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .attempt-display {
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    min-height: 60px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .attempt-label {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 2px;
    flex-shrink: 0;
  }

  .attempt-letters {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: #e0e0ff;
    letter-spacing: 3px;
    flex: 1;
    min-height: 30px;
  }

  .mic-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    transition: all 0.3s ease;
  }

  .mic-indicator.active {
    background: #f5c842;
    box-shadow: 0 0 8px rgba(245,200,66,0.5);
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .btn {
    flex: 1;
    min-width: 120px;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: #f5c842;
    color: #0a0a0f;
  }

  .btn-primary:hover { background: #ffd44d; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }

  .btn-secondary {
    background: transparent;
    color: #888;
    border: 1px solid #2a2a3a;
  }

  .btn-secondary:hover { background: #1c1c28; color: #ccc; }

  .btn-danger {
    background: transparent;
    color: #e24b4a;
    border: 1px solid #3a2020;
  }

  .btn-danger:hover { background: #1c1010; }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  .result-banner {
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: none;
    flex-direction: column;
    gap: 0.5rem;
  }

  .result-banner.correct {
    background: rgba(29, 158, 117, 0.12);
    border: 1px solid rgba(29, 158, 117, 0.3);
    display: flex;
  }

  .result-banner.wrong {
    background: rgba(226, 75, 74, 0.1);
    border: 1px solid rgba(226, 75, 74, 0.25);
    display: flex;
  }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
  }

  .result-banner.correct .result-title { color: #1d9e75; }
  .result-banner.wrong .result-title { color: #e24b4a; }

  .correct-spelling {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: #f5c842;
    letter-spacing: 3px;
  }

  .result-detail {
    font-size: 13px;
    color: #666;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .score-card {
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 0.75rem 1rem;
    text-align: center;
  }

  .score-value {
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    color: #f5c842;
    line-height: 1;
  }

  .score-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }

  .history-section {
    margin-top: 1rem;
  }

  .history-title {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.75rem;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 200px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: #0d0d14;
    border-radius: 8px;
    font-size: 13px;
  }

  .history-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .history-dot.ok { background: #1d9e75; }
  .history-dot.fail { background: #e24b4a; }
  .history-dot.skip { background: #555; }

  .history-word {
    font-family: 'DM Mono', monospace;
    color: #ccc;
    letter-spacing: 1px;
    flex: 1;
  }

  .history-attempt {
    color: #555;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
  }

  .voice-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid #f5c842;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    margin: 0 auto;
    flex-shrink: 0;
  }

  .voice-btn:hover { background: rgba(245,200,66,0.1); transform: scale(1.05); }
  .voice-btn.listening { background: rgba(245,200,66,0.15); animation: ring 1.5s ease infinite; }

  @keyframes ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,200,66,0.3); }
    50% { box-shadow: 0 0 0 12px rgba(245,200,66,0); }
  }

  .voice-btn svg { width: 28px; height: 28px; }

  .phase-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 12px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .phase-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #333;
  }

  .phase-dot.active { background: #f5c842; }
  .phase-dot.done { background: #1d9e75; }

  .no-support {
    background: rgba(226,75,74,0.1);
    border: 1px solid rgba(226,75,74,0.3);
    border-radius: 10px;
    padding: 1rem;
    font-size: 13px;
    color: #e24b4a;
    text-align: center;
    margin-bottom: 1rem;
  }

  .manual-input-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .manual-input {
    flex: 1;
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    color: #f0ead6;
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 0.6rem 1rem;
    outline: none;
    text-transform: uppercase;
  }

  .manual-input:focus { border-color: #f5c842; }

  .divider {
    border: none;
    border-top: 1px solid #1e1e2a;
    margin: 1.25rem 0;
  }

  .word-counter {
    font-size: 11px;
    color: #444;
    text-align: center;
    margin-bottom: 1rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
  }

  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .tab-bar {
    display: flex;
    gap: 0.25rem;
    background: #0d0d14;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
  }

  .tab.active {
    background: #1c1c28;
    color: #f5c842;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>

<div class="confetti-container" id="confettiContainer"></div>

<div class="bee-app">
  <div class="header">
    <span class="bee-icon">🐝</span>
    <h1>Spelling Bee</h1>
    <p>Competition Mode</p>
  </div>

  <div class="card">

    <div class="scoreboard">
      <div class="score-card">
        <div class="score-value" id="scoreCorrect">0</div>
        <div class="score-label">Correct</div>
      </div>
      <div class="score-card">
        <div class="score-value" id="scoreStreak">0</div>
        <div class="score-label">Streak</div>
      </div>
      <div class="score-card">
        <div class="score-value" id="scoreTotal">0</div>
        <div class="score-label">Total</div>
      </div>
    </div>

    <div class="settings-row">
      <div class="setting-group">
        <label>⏱ Time</label>
        <input type="number" id="timerSetting" value="30" min="5" max="120">
        <span style="font-size:12px;color:#555">sec</span>
      </div>
      <div class="setting-group">
        <label>📚 Level</label>
        <select id="levelSelect" style="color:#f5c842;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;cursor:pointer;">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="setting-group">
        <label>🎙 Input</label>
        <select id="inputMode" style="color:#f5c842;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;cursor:pointer;">
          <option value="voice">Voice</option>
          <option value="type">Type</option>
        </select>
      </div>
    </div>

    <div id="noSupportWarning" class="no-support" style="display:none">
      ⚠️ Voice recognition not supported in this browser. Switched to type mode.
    </div>

    <div class="word-display" id="wordDisplay">
      <div class="idle-message">Press "Start Round" to begin</div>
    </div>

    <div id="timerSection" style="display:none">
      <div class="timer-ring">
        <svg viewBox="0 0 120 120">
          <circle class="bg-ring" cx="60" cy="60" r="52"/>
          <circle class="progress-ring" id="progressRing" cx="60" cy="60" r="52"
            stroke-dasharray="326.7" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-center">
          <div class="timer-number" id="timerDisplay">30</div>
          <div class="timer-label">secs</div>
        </div>
      </div>
    </div>

    <div id="voiceSection" style="display:none">
      <div class="attempt-display">
        <span class="attempt-label">Heard</span>
        <span class="attempt-letters" id="attemptDisplay">—</span>
        <span class="mic-indicator" id="micIndicator"></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem;">
        <button class="voice-btn" id="voiceBtn" title="Hold to speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f5c842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <span style="font-size:12px;color:#555;text-align:center;line-height:1.4;">Click mic<br>and spell</span>
      </div>
    </div>

    <div id="typeSection" style="display:none">
      <div class="manual-input-row">
        <input type="text" class="manual-input" id="manualInput" placeholder="TYPE SPELLING..." autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="btn btn-primary" id="submitBtn" style="flex:0;white-space:nowrap;">Submit</button>
      </div>
    </div>

    <div class="result-banner" id="resultBanner">
      <div class="result-title" id="resultTitle"></div>
      <div class="correct-spelling" id="resultSpelling"></div>
      <div class="result-detail" id="resultDetail"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start Round</button>
      <button class="btn btn-secondary" id="skipBtn" disabled>Skip Word</button>
      <button class="btn btn-danger" id="resetBtn">Reset</button>
    </div>

    <hr class="divider">

    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('history')">History</button>
      <button class="tab" onclick="switchTab('words')">Word List</button>
    </div>

    <div class="tab-content active" id="tab-history">
      <div class="history-title">Round history</div>
      <div class="history-list" id="historyList">
        <div style="font-size:13px;color:#444;text-align:center;padding:1rem;">No history yet</div>
      </div>
    </div>

    <div class="tab-content" id="tab-words">
      <div class="history-title">Word bank</div>
      <div id="wordBankDisplay" style="font-size:12px;color:#555;line-height:2;font-family:'DM Mono',monospace;max-height:180px;overflow-y:auto;"></div>
    </div>

  </div>
</div>

<script>
const WORDS = {

    {word:"labyrinthine",def:"Resembling a labyrinth; twisted and complex",origin:"Greek labyrinthos"},
    {word:"melancholy",def:"A feeling of pensive sadness; deep gloom",origin:"Greek melas khole"},
    {word:"nonchalance",def:"The state of being calm and relaxed; casual indifference",origin:"French non chaloir"},
    {word:"obsequious",def:"Excessively obedient or attentive; servile",origin:"Latin obsequium"},
  ]
};

let state = {
  phase: 'idle',
  currentWord: null,
  timer: null,
  timeLeft: 30,
  totalTime: 30,
  correct: 0,
  streak: 0,
  total: 0,
  history: [],
  recognition: null,
  lastHeard: '',
  inputMode: 'voice',
  usedWords: new Set(),
  level: 'medium',
};

function getEl(id){ return document.getElementById(id); }

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognitionActive = false;

function initRecognition(){
  if(!SpeechRecognition){
    getEl('noSupportWarning').style.display='block';
    getEl('inputMode').value='type';
    state.inputMode='type';
    return;
  }
  state.recognition = new SpeechRecognition();
  state.recognition.continuous=false;
  state.recognition.interimResults=true;
  state.recognition.lang='en-US';
  state.recognition.onresult = e => {
    let t='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      t += e.results[i][0].transcript;
    }
    const cleaned = t.trim().replace(/\s+/g,'').toUpperCase();
    state.lastHeard = cleaned;
    getEl('attemptDisplay').textContent = cleaned || '—';
  };
  state.recognition.onend = () => {
    recognitionActive=false;
    getEl('micIndicator').classList.remove('active');
    getEl('voiceBtn').classList.remove('listening');
    if(state.phase==='active' && state.lastHeard){
      checkAnswer(state.lastHeard);
    }
  };
  state.recognition.onerror = e => {
    recognitionActive=false;
    getEl('micIndicator').classList.remove('active');
    getEl('voiceBtn').classList.remove('listening');
  };
}

function pickWord(){
  const pool = WORDS[state.level];
  const available = pool.filter(w => !state.usedWords.has(w.word));
  if(available.length===0){ state.usedWords.clear(); return pickWord(); }
  return available[Math.floor(Math.random()*available.length)];
}

function startRound(){
  state.level = getEl('levelSelect').value;
  state.inputMode = getEl('inputMode').value;
  state.totalTime = parseInt(getEl('timerSetting').value)||30;
  state.timeLeft = state.totalTime;
  state.currentWord = pickWord();
  state.usedWords.add(state.currentWord.word);
  state.lastHeard = '';
  state.phase = 'active';

  renderWord();
  renderTimer();
  getEl('timerSection').style.display='block';
  getEl('resultBanner').className='result-banner';
  getEl('resultBanner').style.display='none';

  if(state.inputMode==='voice'){
    getEl('voiceSection').style.display='block';
    getEl('typeSection').style.display='none';
    getEl('attemptDisplay').textContent='—';
  } else {
    getEl('voiceSection').style.display='none';
    getEl('typeSection').style.display='block';
    getEl('manualInput').value='';
    getEl('manualInput').focus();
  }

  getEl('startBtn').textContent='Next Word';
  getEl('skipBtn').disabled=false;

  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.timeLeft--;
    renderTimer();
    if(state.timeLeft<=0){
      clearInterval(state.timer);
      timeUp();
    }
  },1000);
}

function renderWord(){
  const w = state.currentWord;
  const totalWords = WORDS[state.level].length;
  getEl('wordDisplay').innerHTML=`
    <div class="word-category">${state.level.toUpperCase()} · SPELL THIS WORD</div>
    <div class="word-text">${w.word.toUpperCase()}</div>
    <div class="word-definition">"${w.def}"</div>
    <div class="word-origin">Etymology: ${w.origin}</div>
  `;
}

const circumference = 2*Math.PI*52;
function renderTimer(){
  const ring = getEl('progressRing');
  const frac = state.timeLeft/state.totalTime;
  ring.style.strokeDashoffset = circumference*(1-frac);
  const pct = state.timeLeft/state.totalTime;
  ring.style.stroke = pct>0.5?'#f5c842':pct>0.25?'#ef9f27':'#e24b4a';
  getEl('timerDisplay').textContent=state.timeLeft;
  getEl('timerDisplay').style.color = pct>0.25?'#f5c842':'#e24b4a';
}

function timeUp(){
  state.phase='revealed';
  const attempt = state.inputMode==='type'? getEl('manualInput').value.trim().toUpperCase() : state.lastHeard;
  addHistory(state.currentWord.word, attempt, false, true);
  showResult(false, state.currentWord.word, attempt, true);
  updateScores(false);
  getEl('skipBtn').disabled=true;
  if(state.inputMode==='voice' && recognitionActive){
    state.recognition.stop();
  }
}

function checkAnswer(attempt){
  if(state.phase!=='active') return;
  clearInterval(state.timer);
  state.phase='revealed';
  const correct = attempt.toLowerCase()===state.currentWord.word.toLowerCase();
  addHistory(state.currentWord.word, attempt, correct, false);
  showResult(correct, state.currentWord.word, attempt, false);
  updateScores(correct);
  getEl('skipBtn').disabled=true;
  if(correct) launchConfetti();
}

function showResult(correct, word, attempt, timeout){
  const b = getEl('resultBanner');
  const t = getEl('resultTitle');
  const s = getEl('resultSpelling');
  const d = getEl('resultDetail');
  if(timeout){
    b.className='result-banner wrong';
    t.textContent="⏰ Time's up!";
    s.textContent=word.toUpperCase();
    d.textContent=attempt?`You spelled: ${attempt}`:'No answer given';
  } else if(correct){
    b.className='result-banner correct';
    t.textContent="✓ Correct!";
    s.textContent=word.toUpperCase();
    d.textContent=`Perfect spelling in ${state.totalTime-state.timeLeft}s`;
  } else {
    b.className='result-banner wrong';
    t.textContent="✗ Incorrect";
    s.textContent=`Correct: ${word.toUpperCase()}`;
    d.textContent=attempt?`You spelled: ${attempt}`:'No answer heard';
  }
  b.style.display='flex';
}

function updateScores(correct){
  if(correct){
    state.correct++;
    state.streak++;
  } else {
    state.streak=0;
  }
  state.total++;
  getEl('scoreCorrect').textContent=state.correct;
  getEl('scoreStreak').textContent=state.streak;
  getEl('scoreTotal').textContent=state.total;
}

function addHistory(word, attempt, correct, timeout){
  const entry={word,attempt,correct,timeout,time:new Date()};
  state.history.unshift(entry);
  renderHistory();
}

function renderHistory(){
  const h=getEl('historyList');
  if(!state.history.length){
    h.innerHTML='<div style="font-size:13px;color:#444;text-align:center;padding:1rem;">No history yet</div>';
    return;
  }
  h.innerHTML=state.history.slice(0,15).map(e=>{
    const cls=e.correct?'ok':e.timeout?'skip':'fail';
    const tag=e.correct?'✓':e.timeout?'⏰':'✗';
    return `<div class="history-item">
      <span class="history-dot ${cls}"></span>
      <span class="history-word">${e.word.toUpperCase()}</span>
      <span class="history-attempt">${e.attempt||'—'}</span>
      <span style="font-size:11px;color:${cls==='ok'?'#1d9e75':cls==='fail'?'#e24b4a':'#555'}">${tag}</span>
    </div>`;
  }).join('');
}

function populateWordBank(){
  const level=getEl('levelSelect').value;
  getEl('wordBankDisplay').innerHTML=WORDS[level].map(w=>
    `<span style="margin-right:16px;color:#555">${w.word}</span>`
  ).join('');
}

function skipWord(){
  if(state.phase!=='active') return;
  clearInterval(state.timer);
  state.phase='revealed';
  addHistory(state.currentWord.word,'—',false,false);
  const b=getEl('resultBanner');
  b.className='result-banner wrong';
  getEl('resultTitle').textContent='Skipped';
  getEl('resultSpelling').textContent=state.currentWord.word.toUpperCase();
  getEl('resultDetail').textContent='Word skipped';
  b.style.display='flex';
  state.streak=0;
  state.total++;
  getEl('scoreStreak').textContent=state.streak;
  getEl('scoreTotal').textContent=state.total;
  getEl('skipBtn').disabled=true;
  if(state.inputMode==='voice' && recognitionActive) state.recognition.stop();
}

function resetAll(){
  clearInterval(state.timer);
  state.phase='idle';
  state.correct=0;state.streak=0;state.total=0;
  state.history=[];
  state.usedWords.clear();
  state.lastHeard='';
  getEl('scoreCorrect').textContent=0;
  getEl('scoreStreak').textContent=0;
  getEl('scoreTotal').textContent=0;
  getEl('wordDisplay').innerHTML='<div class="idle-message">Press "Start Round" to begin</div>';
  getEl('timerSection').style.display='none';
  getEl('voiceSection').style.display='none';
  getEl('typeSection').style.display='none';
  getEl('resultBanner').className='result-banner';
  getEl('resultBanner').style.display='none';
  getEl('startBtn').textContent='Start Round';
  getEl('skipBtn').disabled=true;
  renderHistory();
  if(recognitionActive && state.recognition) state.recognition.stop();
}

function launchConfetti(){
  const c=getEl('confettiContainer');
  const colors=['#f5c842','#1d9e75','#f0ead6','#5DCAA5','#ffd44d'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.5+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    p.style.width=p.style.height=(6+Math.random()*8)+'px';
    c.appendChild(p);
    setTimeout(()=>p.remove(),3000);
  }
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['history','words'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(t=>{
    t.classList.toggle('active',t.id==='tab-'+name);
  });
  if(name==='words') populateWordBank();
}

getEl('startBtn').addEventListener('click',startRound);
getEl('skipBtn').addEventListener('click',skipWord);
getEl('resetBtn').addEventListener('click',resetAll);

getEl('voiceBtn').addEventListener('click',()=>{
  if(state.phase!=='active') return;
  if(recognitionActive){ state.recognition.stop(); return; }
  state.lastHeard='';
  getEl('attemptDisplay').textContent='—';
  recognitionActive=true;
  getEl('micIndicator').classList.add('active');
  getEl('voiceBtn').classList.add('listening');
  state.recognition.start();
});

getEl('submitBtn').addEventListener('click',()=>{
  const val=getEl('manualInput').value.trim().toUpperCase();
  if(val) checkAnswer(val);
});

getEl('manualInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const val=getEl('manualInput').value.trim().toUpperCase();
    if(val&&state.phase==='active') checkAnswer(val);
  }
});

getEl('levelSelect').addEventListener('change',()=>{
  state.level=getEl('levelSelect').value;
  populateWordBank();
});

getEl('inputMode').addEventListener('change',()=>{
  state.inputMode=getEl('inputMode').value;
});

initRecognition();
populateWordBank();
</script>
